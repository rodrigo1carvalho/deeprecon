[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deeprecon"
version = "1.0.0"
description = "Ferramenta OSINT open source para reconhecimento em pentest: Google Hacking, subdomínios, WHOIS e dark web."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Rodrigo Pereira Carvalho" }
]
keywords = ["osint", "pentest", "recon", "security", "kali-linux", "google-dorks", "dark-web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "requests[socks]>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "dnspython>=2.6.0",
    "rich>=13.7.0",
    "python-whois>=0.9.4",
]

[project.urls]
Homepage = "https://github.com/SEU_USUARIO/deeprecon"
Issues = "https://github.com/SEU_USUARIO/deeprecon/issues"

[project.scripts]
deeprecon = "deeprecon.cli:main"

[tool.setuptools.packages.find]
include = ["deeprecon*"]
